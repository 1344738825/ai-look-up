name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: python -m py_compile hooks/lookup_hook.py
      - name: golden conformance (Python side)
        run: python test/golden_check.py

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: dsh smoke tests
        run: node test/dsh-smoke.mjs
      - name: golden conformance (JS side)
        run: node test/golden.mjs
