name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      # fail-fast 关掉:一个 OS 失败不影响另一个 OS,一次跑完拿到全部诊断
      fail-fast: false
      matrix:
        # 双平台:ubuntu 验证跨平台行为与 POSIX 路径(state_lock/channel);
        # windows 验证平台专属防线(revert_verify 的 win32 限定用例在 Linux 上
        # 注入后行为等价、不可能变红,见 revert_verify.py 平台说明)。
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile
        run: python -m py_compile hooks/lookup_hook.py hooks/lookup_watcher.py
      - name: golden conformance (Python side)
        run: python test/golden_check.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: third-channel end-to-end
        run: python test/channel_check.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: cross-process state lock
        run: python test/lock_check.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: revert-verification (defenses must be real)
        run: python test/revert_verify.py
        env:
          NODE_BIN: node
          PYTHONUNBUFFERED: "1"

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: dsh smoke tests
        run: node test/dsh-smoke.mjs
        env:
          PYTHONUNBUFFERED: "1"
      - name: golden conformance (JS side)
        run: node test/golden.mjs
        env:
          PYTHONUNBUFFERED: "1"
